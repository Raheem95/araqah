<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Options — Beautiful Menu</title>
    <style>
      :root {
        --bg1: #0f172a;
        --card: rgba(255, 255, 255, 0.06);
        --glass: rgba(255, 255, 255, 0.04);
        --accent-1: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
        --accent-2: linear-gradient(135deg, #06b6d4 0%, #7c3aed 100%);
        --glass-border: rgba(255, 255, 255, 0.08);
        --muted: rgba(255, 255, 255, 0.7);
        --radius: 14px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(
            1200px 400px at 10% 10%,
            rgba(124, 58, 237, 0.12),
            transparent
          ),
          radial-gradient(
            900px 300px at 90% 90%,
            rgba(6, 182, 212, 0.08),
            transparent
          ),
          var(--bg1);
        color: #fff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .container {
        width: 100%;
        max-width: 1100px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .title {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--accent-1);
        box-shadow: 0 6px 18px rgba(124, 58, 237, 0.16);
        font-weight: 700;
        color: white;
        font-size: 18px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p.lead {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .container {
          padding: 18px;
        }
      }

      .card {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--glass-border);
        transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.2, 1),
          box-shadow 0.28s;
        text-decoration: none;
        color: inherit;
        min-height: 84px;
        backdrop-filter: blur(6px) saturate(120%);
      }

      .card:focus,
      .card:hover {
        transform: translateY(-6px) scale(1.01);
        box-shadow: 0 14px 40px rgba(2, 6, 23, 0.6),
          0 6px 30px rgba(6, 182, 212, 0.06);
        outline: none;
      }

      .icon-wrap {
        width: 66px;
        height: 66px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.03);
        flex: 0 0 66px;
      }

      .meta {
        flex: 1;
      }
      .meta .en {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 6px;
      }
      .meta .ar {
        font-size: 13px;
        color: var(--muted);
      }

      .arrow {
        font-weight: 700;
        opacity: 0.9;
      }

      /* Accent variants for each option */
      .a1 .icon-wrap {
        background: var(--accent-1);
        box-shadow: 0 8px 28px rgba(124, 58, 237, 0.16);
      }
      .a2 .icon-wrap {
        background: linear-gradient(135deg, #06b6d4 0%, #10b981 100%);
        box-shadow: 0 8px 28px rgba(6, 182, 212, 0.14);
      }
      .a3 .icon-wrap {
        background: linear-gradient(135deg, #f97316 0%, #ef4444 100%);
        box-shadow: 0 8px 28px rgba(249, 115, 22, 0.12);
      }
      .a4 .icon-wrap {
        background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        box-shadow: 0 8px 28px rgba(245, 158, 11, 0.12);
      }
      .a5 .icon-wrap {
        background: linear-gradient(135deg, #06b6d4 0%, #7c3aed 100%);
        box-shadow: 0 8px 28px rgba(6, 182, 212, 0.12);
      }
      .a6 .icon-wrap {
        background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
        box-shadow: 0 8px 28px rgba(16, 185, 129, 0.12);
      }

      /* small subtle label */
      .label-small {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.025);
      }

      /* focus ring for keyboard users */
      .card:focus {
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.12),
          0 14px 40px rgba(2, 6, 23, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="container" role="region" aria-label="Options menu">
      <header>
        <div class="title">
          <div
            class="brand"
            style="
              font-size: 28px;
              font-weight: 700;
              letter-spacing: 1px;
              background: linear-gradient(135deg, #7c3aed, #06b6d4);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
              text-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
              margin-right: 10px;
              font-family: 'Poppins', sans-serif;
            ">
            Raheem Templates
          </div>
          <div class="logo">MENU</div>
          <div>
            <h1>Choose an option</h1>
            <p class="lead">
              Seven quick actions — tap or press Enter to open.
            </p>
          </div>
        </div>
        <div class="label-small">7 options</div>
      </header>

      <main class="grid" id="optionsGrid">
        <a
          class="card a1"
          href="option1"
          target="_blank"
          role="button"
          aria-label="Option 1 — Services">
          <div class="icon-wrap">
            <!-- simple svg icon -->
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden>
              <path
                d="M4 7h16M4 12h16M4 17h10"
                stroke="white"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="meta">
            <div class="en">Option 1</div>
            <div class="ar">الخيار الأول</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a
          class="card a2"
          href="option2"
          target="_blank"
          role="button"
          aria-label="Option 2 — Bookings">
          <div class="icon-wrap">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden>
              <path
                d="M12 2v20M5 7h14"
                stroke="white"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="meta">
            <div class="en">Option 2</div>
            <div class="ar">الخيار الثاني</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a
          class="card a3"
          href="option3"
          target="_blank"
          role="button"
          aria-label="Option 3 — Reports">
          <div class="icon-wrap">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden>
              <path
                d="M3 3v18h18"
                stroke="white"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="meta">
            <div class="en">Option 3</div>
            <div class="ar">الخيار الثالث</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a
          class="card a4"
          href="option4"
          target="_blank"
          role="button"
          aria-label="Option 4 — Customers">
          <div class="icon-wrap">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden>
              <path
                d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 22c2-6 10-6 10-6s8 0 10 6"
                stroke="white"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="meta">
            <div class="en">Option 4</div>
            <div class="ar">الخيار الرابع</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a
          class="card a5"
          href="option5"
          target="_blank"
          role="button"
          aria-label="Option 5 — Settings">
          <div class="icon-wrap">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden>
              <path
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19.4 15a1 1 0 0 0 .6 1.2l.1.04a2 2 0 0 1 .9 2.6 2 2 0 0 1-2.6.9l-.04-.02a1 1 0 0 0-1.2.6l-.2.6a2 2 0 0 1-2 1.3h-1.6a2 2 0 0 1-2-1.3l-.2-.6a1 1 0 0 0-1.2-.6l-.04.02a2 2 0 0 1-2.6-.9 2 2 0 0 1 .9-2.6l.1-.04a1 1 0 0 0 .6-1.2l-.06-.24a2 2 0 0 1 0-1.2l.06-.24a1 1 0 0 0-.6-1.2l-.1-.04a2 2 0 0 1-.9-2.6 2 2 0 0 1 2.6-.9l.04.02a1 1 0 0 0 1.2-.6l.2-.6A2 2 0 0 1 12 2h1.6a2 2 0 0 1 2 1.3l.2.6a1 1 0 0 0 1.2.6l.04-.02a2 2 0 0 1 2.6.9 2 2 0 0 1-.9 2.6l-.1.04a1 1 0 0 0-.6 1.2l.06.24c.08.34.08.7 0 1.04l-.06.24z"
                stroke="white"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="meta">
            <div class="en">Option 5</div>
            <div class="ar">الخيار الخامس</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a
          class="card a6"
          href="option6"
          target="_blank"
          role="button"
          aria-label="Option 6 — Help">
          <div class="icon-wrap">
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden>
              <path
                d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm1.1-7.6a2.1 2.1 0 0 0-4.2 0"
                stroke="white"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
          <div class="meta">
            <div class="en">Option 6</div>
            <div class="ar">الخيار السادس</div>
          </div>
          <div class="arrow">›</div>
        </a>
      </main>
    </div>

    <script>
      // Make Enter/Space activate the anchors like buttons for keyboard users
      document.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            el.click();
          }
        });
      });
    </script>
  </body>
</html>
